app = "school-schedule-only"
primary_region = "gru"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data2"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
