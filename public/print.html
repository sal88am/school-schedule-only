<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الجدول الدراسي — سِجِلّ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #fff; padding: 28px; }
  .print-actions { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
  .filter-subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-top: -8px; margin-bottom: 20px; }
  @media print {
    .print-actions { display: none; }
    body { padding: 0; }
    .timetable-wrap { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="print-actions">
    <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button>
  </div>

  <div class="school-header" id="schoolHeader">
    <h1>جدول الحصص الأسبوعي</h1>
  </div>
  <p class="filter-subtitle" id="filterSubtitle"></p>

  <div id="scheduleGrid" class="timetable-wrap"></div>

<script>
const DAY_NAMES = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const SUBJECT_PALETTE = ["#2F4858", "#C98A3E", "#4C7A6B", "#8E5B45", "#5B6EA8", "#8B6F9E", "#B4533C", "#5D8A6E"];

function subjectColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return SUBJECT_PALETTE[hash % SUBJECT_PALETTE.length];
}

async function api(path) {
  const res = await fetch(path);
  return res.json();
}

async function render() {
  const params = new URLSearchParams(location.search);
  const classId = params.get("class_id");
  const teacherId = params.get("teacher_id");

  let scheduleUrl = "/api/public/schedule";
  const qs = [];
  if (classId) qs.push(`class_id=${classId}`);
  if (teacherId) qs.push(`teacher_id=${teacherId}`);
  if (qs.length) scheduleUrl += "?" + qs.join("&");

  const [schedule, classes, teachers, schoolInfo] = await Promise.all([
    api(scheduleUrl),
    api("/api/public/classes"),
    api("/api/public/teachers"),
    api("/api/public/school-info"),
  ]);

  // ترويسة المدرسة: الشعار، ثم عنوان الجدول، وتحته اسم المدرسة
  const headerEl = document.getElementById("schoolHeader");
  let headerHtml = "";
  if (schoolInfo.school_logo) headerHtml += `<img src="${schoolInfo.school_logo}" alt="شعار المدرسة" />`;
  headerHtml += `<h1>جدول الحصص الأسبوعي</h1>`;
  if (schoolInfo.school_name) headerHtml += `<div class="school-name">${schoolInfo.school_name}</div>`;
  headerEl.innerHTML = headerHtml;

  let subtitle = "";
  if (classId) {
    const cls = classes.find((c) => String(c.id) === classId);
    subtitle = cls ? `صف: ${cls.name}` : "";
  } else if (teacherId) {
    const t = teachers.find((t) => String(t.id) === teacherId);
    subtitle = t ? `المعلم: ${t.name}` : "";
  }
  document.getElementById("filterSubtitle").textContent = subtitle;

  const periodNumbers = [...new Set(schedule.map((s) => s.period_number))].sort((a, b) => a - b);
  const byDayPeriod = {};
  schedule.forEach((s) => {
    const key = `${s.day_of_week}-${s.period_number}`;
    if (!byDayPeriod[key]) byDayPeriod[key] = [];
    byDayPeriod[key].push(s);
  });

  let html = `<table class="timetable"><thead><tr><th></th>${DAY_NAMES.map((d) => `<th>${d}</th>`).join("")}</tr></thead><tbody>`;
  periodNumbers.forEach((num) => {
    const timeRow = schedule.find((s) => s.period_number === num);
    const timeLabel = timeRow && timeRow.start_time ? `<div class="period-time">${timeRow.start_time}</div>` : "";
    html += `<tr><th class="period-cell"><span class="period-tab">${num}</span>${timeLabel}</th>`;
    DAY_NAMES.forEach((_, dayIdx) => {
      const entries = byDayPeriod[`${dayIdx}-${num}`] || [];
      html += "<td>";
      entries.forEach((e) => {
        html += `<div class="slot" style="--slot-color:${subjectColor(e.subject_name)}">
          <span class="subj">${e.subject_name}</span>
          <span class="meta">${e.class_name} · ${e.teacher_name}</span>
        </div>`;
      });
      html += "</td>";
    });
    html += "</tr>";
  });
  html += "</tbody></table>";

  document.getElementById("scheduleGrid").innerHTML =
    periodNumbers.length ? html : '<p class="muted-text">لا يوجد جدول محفوظ بعد.</p>';
}

render();
</script>
</body>
</html>
