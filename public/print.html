<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>جدول الحصص الأسبوعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 9mm; }
  :root { --ink:#14212B; --muted:#5E6C7A; --line:#CBD3DB; --brand:#1E3A4C; --brand2:#2D566B; --accent:#C48A2C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; color: var(--ink); background: #E9EDF1; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; padding: 10px; background: var(--brand); }
  .bar button { border: 0; border-radius: 10px; padding: 10px 22px; font: 600 14px "IBM Plex Sans Arabic", sans-serif; cursor: pointer; background: var(--accent); color: #2B1D05; }
  .bar button.alt { background: rgba(255,255,255,.14); color: #fff; }

  /* الورقة: A4 أفقي */
  .sheet { width: 297mm; min-height: 210mm; margin: 16px auto; padding: 9mm; background: #fff; box-shadow: 0 10px 40px rgba(20,33,43,.2); display: flex; flex-direction: column; }
  .ph { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 3px solid var(--accent); margin-bottom: 8px; }
  .ph-logo img { max-height: 21mm; max-width: 48mm; object-fit: contain; display: block; }
  .ph-title { text-align: center; }
  .ph-title h1 { margin: 0; font: 800 22px "Cairo", sans-serif; color: var(--brand); letter-spacing: .2px; }
  .ph-title .school { margin-top: 1px; font: 700 15px "Cairo", sans-serif; color: var(--ink); }
  .ph-meta { text-align: left; }
  .chip { display: inline-block; background: var(--brand); color: #fff; padding: 6px 18px; border-radius: 9px; font: 700 16px "Cairo", sans-serif; }
  .year { margin-top: 4px; font-size: 12px; color: var(--muted); }

  table { width: 100%; border-collapse: separate; border-spacing: 0; flex: 1; table-layout: fixed; border: 1.5px solid var(--brand); border-radius: 8px; overflow: hidden; }
  thead th { background: linear-gradient(180deg, var(--brand2), var(--brand)); color: #fff; font: 700 14px "Cairo", sans-serif; padding: 7px 4px; text-align: center; border-inline-start: 1px solid rgba(255,255,255,.18); }
  thead th:first-child { border-inline-start: 0; }
  .sh { display: block; font: 500 10px "IBM Plex Sans Arabic", sans-serif; opacity: .8; }
  th.lesson { width: 27mm; background: #EEF2F6; color: var(--brand); font: 800 13px "Cairo", sans-serif; text-align: center; border-top: 1px solid var(--line); }
  td { border-top: 1px solid var(--line); border-inline-start: 1px solid var(--line); padding: 3px 4px; vertical-align: middle; text-align: center; }
  td.off { background: repeating-linear-gradient(45deg, #F6F7F9, #F6F7F9 4px, #ECEEF1 4px, #ECEEF1 8px); }
  .t { display: block; font: 500 8.5px "JetBrains Mono", monospace; color: var(--muted); direction: ltr; unicode-bidi: isolate; margin-bottom: 1px; }
  .slot { --c: var(--brand); border-radius: 6px; padding: 3px 6px; background: #fff; background: color-mix(in srgb, var(--c) 12%, #fff); border-inline-start: 3.5px solid var(--c); text-align: right; }
  .slot b { display: block; font: 800 12.5px "Cairo", sans-serif; color: var(--c); color: color-mix(in srgb, var(--c) 75%, #000); line-height: 1.25; }
  .slot i { display: block; font: normal 400 10px "IBM Plex Sans Arabic", sans-serif; color: #44515F; line-height: 1.25; }
  .foot { margin-top: 6px; display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  .msg { text-align: center; padding: 60px; color: var(--muted); }

  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheet { width: auto; min-height: 0; height: 192mm; margin: 0; padding: 0; box-shadow: none; page-break-after: always; break-after: page; }
    .sheet:last-child { page-break-after: auto; break-after: auto; }
  }
  @media (max-width: 1100px) { .sheet { zoom: .55; margin: 8px auto; } }
  @media (max-width: 700px) { .sheet { zoom: .34; } }
  @media print { .sheet { zoom: 1 !important; } }
</style>
</head>
<body>
  <div class="bar no-print">
    <button onclick="window.print()">🖨️ طباعة (A4 أفقي)</button>
    <button class="alt" onclick="history.length > 1 ? history.back() : window.close()">رجوع</button>
  </div>
  <div id="sheets"></div>

<script>
function t12(t) { if (!t) return "—"; const [h, m] = String(t).split(":").map(Number); const s = h >= 12 ? "م" : "ص"; return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${s}`; }
function rng12(a, b) { if (!a || !b) return ""; const x = t12(a), y = t12(b); const sx = x.slice(-1), sy = y.slice(-1); return "\u2066" + (sx === sy ? `${x.slice(0, -2)}–${y}` : `${x}–${y}`) + "\u2069"; }

const DAY_NAMES = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const SHIFT_LABEL = { morning: "صباحي", evening: "مسائي" };
const ORD = ["الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر", "الحادي عشر", "الثاني عشر"];
const lessonName = (n) => `الدرس ${ORD[n - 1] || n}`;
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CODE = new URLSearchParams(location.search).get("s") || "";
const api = (p) => fetch(p.replace("/api/public/", `/api/public/${encodeURIComponent(CODE)}/`)).then((r) => r.json());

function sheet({ info, subtitle, rows, dayPeriods, shifts, mode, cls }) {
  const days = Object.keys(dayPeriods).map(Number).sort((a, b) => a - b);
  const periodsOf = (d) => (cls && cls.periods_by_day && cls.periods_by_day[d] != null ? cls.periods_by_day[d] : dayPeriods[d].length);
  const maxP = Math.max(...days.map((d) => dayPeriods[d].length), 0);
  const rowH = Math.max(12, Math.min(22, Math.floor(118 / Math.max(maxP, 1)))); // mm
  let h = `<section class="sheet"><header class="ph">
    <div class="ph-logo">${info.school_logo ? `<img src="${esc(info.school_logo)}" alt="شعار المدرسة" />` : ""}</div>
    <div class="ph-title"><h1>جدول الحصص الأسبوعي</h1>${info.school_name ? `<div class="school">${esc(info.school_name)}</div>` : ""}${info.school_year ? `<div class="year">العام الدراسي ${esc(info.school_year)}</div>` : ""}</div>
    <div class="ph-meta"><span class="chip">${esc(subtitle)}</span></div></header>`;
  h += `<table><thead><tr><th style="width:27mm"></th>${days.map((d) => `<th>${DAY_NAMES[d]}<span class="sh">${SHIFT_LABEL[shifts[d]] || ""}</span></th>`).join("")}</tr></thead><tbody>`;
  for (let p = 1; p <= maxP; p++) {
    h += `<tr style="height:${rowH}mm"><th class="lesson">${lessonName(p)}</th>`;
    days.forEach((d) => {
      if (p > periodsOf(d)) { h += `<td class="off"></td>`; return; }
      const pt = dayPeriods[d][p - 1];
      const s = rows.find((r) => r.day_of_week === d && r.period_number === p);
      h += `<td>${pt ? `<span class="t">${rng12(pt.start, pt.end)}</span>` : ""}${s ? `<div class="slot" style="--c:${esc(s.subject_color || "#1E3A4C")}"><b>${esc(s.subject_name)}</b><i>${esc(mode === "teacher" ? s.class_name : s.teacher_name)}</i></div>` : ""}</td>`;
    });
    h += "</tr>";
  }
  return h + "</tbody></table></section>";
}

(async function () {
  const q = new URLSearchParams(location.search);
  const [info, schedule, classes, teachers, dayPeriods, wd] = await Promise.all([
    api("/api/public/school-info"), api("/api/public/schedule"), api("/api/public/classes"),
    api("/api/public/teachers"), api("/api/public/day-periods"), api("/api/public/working-days"),
  ]);
  const el = document.getElementById("sheets");
  if (!Array.isArray(classes) || !Array.isArray(schedule)) { el.innerHTML = '<p class="msg">الرابط غير صالح.</p>'; return; }
  const shifts = wd.shifts, out = [];
  if (q.get("all")) {
    classes.forEach((c) => out.push(sheet({ info, subtitle: `الصف: ${c.name}`, rows: schedule.filter((s) => s.class_id === c.id), dayPeriods, shifts, mode: "class", cls: c })));
  } else if (q.get("teacher_id")) {
    const t = teachers.find((x) => String(x.id) === q.get("teacher_id"));
    out.push(sheet({ info, subtitle: `المعلم: ${t ? t.name : ""}`, rows: schedule.filter((s) => String(s.teacher_id) === q.get("teacher_id")), dayPeriods, shifts, mode: "teacher" }));
  } else {
    const c = classes.find((x) => String(x.id) === q.get("class_id")) || classes[0];
    if (c) out.push(sheet({ info, subtitle: `الصف: ${c.name}`, rows: schedule.filter((s) => s.class_id === c.id), dayPeriods, shifts, mode: "class", cls: c }));
  }
  el.innerHTML = out.join("") || '<p class="msg">لا يوجد جدول محفوظ بعد.</p>';
})();
</script>
</body>
</html>
