<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الجدول الدراسي — سِجِلّ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; padding: 20px; }
  .print-actions { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
  .sheet { page-break-after: always; break-after: page; }
  .sheet:last-child { page-break-after: auto; break-after: auto; }
  .sub-title { text-align: center; font-family: "Cairo", sans-serif; font-weight: 700; font-size: 17px; margin: -8px 0 4px; color: var(--ink); }
  .year { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .timetable { min-width: 0; }
  .timetable td { height: 64px; min-width: 0; }
  .shift-tag { display: block; font-size: 10px; font-weight: 500; opacity: .8; }
  @media print {
    .print-actions { display: none; }
    body { padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .timetable-wrap { box-shadow: none; border-radius: 0; overflow: visible; }
    .timetable { border-radius: 0; }
    .timetable td { height: 17mm; padding: 3px; }
    .slot { box-shadow: none; padding: 4px 7px; }
    .school-header { margin-bottom: 8px; }
    .school-header img { max-height: 16mm; }
    .school-header h1 { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="print-actions"><button class="btn btn-primary" onclick="window.print()">🖨️ طباعة (A4 أفقي)</button></div>
  <div id="sheets"></div>

<script>
const DAY_NAMES = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const SHIFT_LABEL = { morning: "صباحي", evening: "مسائي" };
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CODE = new URLSearchParams(location.search).get("s") || "";
const api = (p) => fetch(p.replace("/api/public/", `/api/public/${encodeURIComponent(CODE)}/`)).then((r) => r.json());

function sheet({ info, title, rows, dayPeriods, shifts, mode, cls }) {
  const days = Object.keys(dayPeriods).map(Number).sort((a, b) => a - b);
  const periodsOf = (d) => (cls && cls.custom_periods_per_day ? cls.custom_periods_per_day : dayPeriods[d].length);
  const maxP = Math.max(...days.map(periodsOf), 0);
  let h = `<section class="sheet"><div class="school-header">`;
  if (info.school_logo) h += `<img src="${esc(info.school_logo)}" alt="شعار المدرسة" />`;
  h += `<h1>جدول الحصص الأسبوعي</h1>`;
  if (info.school_name) h += `<div class="school-name">${esc(info.school_name)}</div>`;
  h += `</div><div class="sub-title">${esc(title)}</div>`;
  if (info.school_year) h += `<div class="year">العام الدراسي ${esc(info.school_year)}</div>`;
  h += `<div class="timetable-wrap"><table class="timetable"><thead><tr><th></th>${days.map((d) => `<th>${DAY_NAMES[d]}<span class="shift-tag">${SHIFT_LABEL[shifts[d]] || ""}</span></th>`).join("")}</tr></thead><tbody>`;
  for (let p = 1; p <= maxP; p++) {
    h += `<tr><th class="period-cell"><span class="period-tab">${p}</span></th>`;
    days.forEach((d) => {
      if (p > periodsOf(d)) { h += `<td class="off"></td>`; return; }
      const pt = dayPeriods[d][p - 1];
      const s = rows.find((r) => r.day_of_week === d && r.period_number === p);
      h += `<td>${pt ? `<div class="cell-time">${pt.start}–${pt.end}</div>` : ""}${s ? `<div class="slot" style="--slot-color:${esc(s.subject_color || "#2F4858")}"><span class="subj">${esc(s.subject_name)}</span><span class="meta">${esc(mode === "teacher" ? s.class_name : s.teacher_name)}</span></div>` : ""}</td>`;
    });
    h += "</tr>";
  }
  return h + "</tbody></table></div></section>";
}

(async function () {
  const q = new URLSearchParams(location.search);
  const [info, schedule, classes, teachers, dayPeriods, wd] = await Promise.all([
    api("/api/public/school-info"), api("/api/public/schedule"), api("/api/public/classes"),
    api("/api/public/teachers"), api("/api/public/day-periods"), api("/api/public/working-days"),
  ]);
  if (!Array.isArray(classes) || !Array.isArray(schedule)) { document.getElementById("sheets").innerHTML = '<p class="muted-text">الرابط غير صالح.</p>'; return; }
  const shifts = wd.shifts;
  const out = [];
  if (q.get("all")) {
    classes.forEach((c) => out.push(sheet({ info, title: `الصف: ${c.name}`, rows: schedule.filter((s) => s.class_id === c.id), dayPeriods, shifts, mode: "class", cls: c })));
  } else if (q.get("teacher_id")) {
    const t = teachers.find((x) => String(x.id) === q.get("teacher_id"));
    out.push(sheet({ info, title: `المعلم: ${t ? t.name : ""}`, rows: schedule.filter((s) => String(s.teacher_id) === q.get("teacher_id")), dayPeriods, shifts, mode: "teacher" }));
  } else {
    const c = classes.find((x) => String(x.id) === q.get("class_id")) || classes[0];
    if (c) out.push(sheet({ info, title: `الصف: ${c.name}`, rows: schedule.filter((s) => s.class_id === c.id), dayPeriods, shifts, mode: "class", cls: c }));
  }
  document.getElementById("sheets").innerHTML = out.length ? out.join("")   : '<p class="muted-text">الرابط غير صالح أو لا يوجد جدول محفوظ بعد.</p>';
})();
</script>
</body>
</html>
